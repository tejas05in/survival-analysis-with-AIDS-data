[project]
name = "survival-analysis-with-aids-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10.12"
dependencies = [
    "auton-survival>=0.1.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.9",
    "numpy>=1.26.4",
    "pandas>=1.5.3",
    "pycox>=0.3.0",
    "scikit-learn>=1.2.2",
    "scikit-survival>=0.21.0",
    "scipy==1.13.1",
    "seaborn>=0.13.2",
]

[project.scripts]
survival-analysis-with-aids-data = "survival_analysis_with_aids_data:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
